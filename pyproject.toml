[project]
name = "foundry-onboarding"
version = "0.1.0"
description = "Foundry onboarding using AWS Lambda and Step Functions"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aws-cdk-lib>=2.269.0",
    "constructs>=10.8.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [
    "cdk.out",
    ".venv"
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
exclude = [
    "cdk.out",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.coverage.run]
branch = true
source = ["infrastructure", "src"]

[tool.coverage.report]
show_missing = true
skip_covered = true