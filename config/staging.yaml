---
environment: staging
aws_region: ap-southeast-1

lambda_function:
  memory_size_mb: 256
  timeout_seconds: 30

workflow:
  timeout_seconds: 300
  retry:
    interval_seconds: 2
    max_attempts: 3
    backoff_rate: 2.0

observability:
  log_retention_days: 30
  enable_tracing: false
  workflow_log_level: ALL

ingestion:
  sqs:
    mode: external_pending
    # batch_size: 10
    # external:
    #   queue_arn: arn:aws:sqs:ap-southeast-1:061051259053:foundry-staging-external-onboarding
    #   event_source_mapping_enabled: true

parameters:
  generic_variable_name: /foundry/staging/generic/example-variable
  generic_variable_value: hello-from-staging-parameter-store
  generic_secret_name: /foundry/staging/generic/example-secret

onboarding:
  allowed_email_domains_parameter_name: /foundry/staging/onboarding/allowed-email-domains

integrations:
  gitlab:
    base_url_parameter_name: /foundry/staging/gitlab/base-url
    api_token_parameter_name: /foundry/staging/gitlab/api-token
    tls_verify: true
  slack:
    team_id_parameter_name: /foundry/staging/slack/team-id
    channel_ids_parameter_name: /foundry/staging/slack/channel-ids
    credentials_secret_name: foundry/staging/slack/credentials
